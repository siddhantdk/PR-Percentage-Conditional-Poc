name: CI Tests

on:
  pull_request:
    branches:
      - production

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run tests with coverage and generate JSON summary
        run: npx jest --coverage --coverageReporters=json-summary

      - name: Verify coverage file
        run: |
          echo "Listing coverage folder:"
          ls -l coverage/
          echo "Displaying coverage-summary.json:"
          cat coverage/coverage-summary.json || echo "File not found"

      - name: Check coverage thresholds
        run: |
          node -e "
          const fs = require('fs');
          const coverage = JSON.parse(fs.readFileSync('coverage/coverage-summary.json'));
          const totalStatements = coverage.total.statements.pct;
          const totalBranches = coverage.total.branches.pct;
          const totalFunctions = coverage.total.functions.pct;
          const totalLines = coverage.total.lines.pct;

          console.log(\`Statements coverage: \${totalStatements}%\`);
          console.log(\`Branches coverage: \${totalBranches}%\`);
          console.log(\`Functions coverage: \${totalFunctions}%\`);
          console.log(\`Lines coverage: \${totalLines}%\`);

          const minCoverage = 90;
          if (
            totalStatements < minCoverage ||
            totalBranches < minCoverage ||
            totalFunctions < minCoverage ||
            totalLines < minCoverage
          ) {
            console.error('Coverage below 90%');
            process.exit(1);
          }
          "
