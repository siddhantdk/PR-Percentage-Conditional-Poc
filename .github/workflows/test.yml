name: CI Tests

on:
  pull_request:
    branches:
      - production

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run tests and generate JSON report
        run: npx jest --json --outputFile=jest-results.json

      - name: Check test pass percentage
        run: |
          node -e "
          const fs = require('fs');
          const results = JSON.parse(fs.readFileSync('jest-results.json'));
          const total = results.numTotalTests;
          const passed = results.numPassedTests;
          const percent = (passed / total) * 100;
          console.log(\`Test pass percentage: \${percent}%\`);
          if (percent < 90) {
            console.error('Test pass percentage below 90%');
            process.exit(1);
          }
          "
