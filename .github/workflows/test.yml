name: CI Tests

on:
    pull_request:
        branches:
            - production

jobs:
    test:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repo
              uses: actions/checkout@v3

            - name: Set up Node.js
              uses: actions/setup-node@v3
              with:
                  node-version: 20

            - name: Install dependencies
              run: npm install

            - name: Run tests with coverage
              run: npm test -- --coverage --watchAll=false --json --outputFile=jest-coverage.json

            - name: Check coverage threshold
              run: |
                  COVERAGE=$(node -p "require('./jest-coverage.json').coverageMap ? Object.values(require('./jest-coverage.json').coverageMap).reduce((acc, file) => acc + Object.values(file.s).reduce((a,b)=>a+b,0),0) / Object.values(require('./jest-coverage.json').coverageMap).reduce((acc, file) => acc + Object.keys(file.s).length,0) * 100 : 100")
                  echo "Calculated Coverage: $COVERAGE%"
                  if (( $(echo "$COVERAGE < 90" | bc -l) )); then
                    echo "Coverage too low!"
                    exit 1
                  fi
