name: CI Tests

on:
    pull_request:
        branches:
            - production

jobs:
    test:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repo
              uses: actions/checkout@v3

            - name: Set up Node.js
              uses: actions/setup-node@v3
              with:
                  node-version: 20

            - name: Install dependencies
              run: npm install

            - name: Run tests
              run: npm test -- --watchAll=false
              # Ensure tests run without coverage first to confirm they pass

            - name: Run tests with coverage
              run: npm test -- --coverage --watchAll=false --coverageReporters=json --coverageReporters=text-summary
              # Generates coverage report in JSON and text-summary formats

            - name: Check coverage threshold
              run: |
                  # Extract coverage metrics from the text-summary output
                  COVERAGE_SUMMARY=$(cat coverage/lcov-report/index.html | grep -oP 'Statements\s*:\s*\K[\d.]+%')
                  STATEMENTS=$(echo $COVERAGE_SUMMARY | grep -oP '[\d.]+')
                  echo "Statement Coverage: $STATEMENTS%"

                  # Check if coverage is below 90%
                  if (( $(echo "$STATEMENTS < 90" | bc -l) )); then
                    echo "Error: Statement coverage ($STATEMENTS%) is below 90% threshold!"
                    cat coverage/lcov-report/index.html | grep -A 10 "Coverage summary"
                    exit 1
                  fi

                  # Optionally, check other metrics (branches, functions, lines)
                  BRANCHES=$(cat coverage/lcov-report/index.html | grep -oP 'Branches\s*:\s*\K[\d.]+%')
                  FUNCTIONS=$(cat coverage/lcov-report/index.html | grep -oP 'Functions\s*:\s*\K[\d.]+%')
                  LINES=$(cat coverage/lcov-report/index.html | grep -oP 'Lines\s*:\s*\K[\d.]+%')

                  echo "Branch Coverage: $BRANCHES"
                  echo "Function Coverage: $FUNCTIONS"
                  echo "Line Coverage: $LINES"

                  # Enforce 90% for other metrics (optional)
                  for METRIC in "$BRANCHES" "$FUNCTIONS" "$LINES"; do
                    VALUE=$(echo $METRIC | grep -oP '[\d.]+')
                    if (( $(echo "$VALUE < 90" | bc -l) )); then
                      echo "Error: Coverage metric ($METRIC) is below 90% threshold!"
                      exit 1
                    fi
                  done
